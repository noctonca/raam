name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The web host and the core's WebGL1 linkage are wasm32-only code,
      # so the native clippy above never sees them.
      - name: web host lints clean for wasm
        run: cargo clippy -p raam-web --target wasm32-unknown-unknown -- -D warnings
