name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request's newer push cancels its stale run; main runs every push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The desktop host links the system's libGL (build.rs), and the runner
      # has no libGL.so to link against. Bounded and retried: a stalled
      # Ubuntu mirror gives no error to retry on and would sit until the
      # job's timeout.
      - name: libGL for the desktop host's link
        run: |
          for attempt in 1 2 3; do
            sudo dpkg --configure -a || true
            if timeout -k 30 90 sudo apt-get -o Acquire::Retries=5 update \
              && timeout -k 30 240 sudo apt-get -o Acquire::Retries=5 \
                install -y --no-install-recommends libgl-dev; then
              exit 0
            fi
            echo "apt attempt ${attempt} failed or timed out; retrying in 10s"
            sleep 10
          done
          echo "apt failed after 3 attempts" >&2
          exit 1
      - run: cargo test --workspace
      # The web host and the core's WebGL1 linkage are wasm32-only code,
      # so the native clippy above never sees them.
      - name: web host lints clean for wasm
        run: cargo clippy -p raam-web --target wasm32-unknown-unknown -- -D warnings
      # The `gles` feature swaps the desktop host's GL linkage (a GPU with
      # no core profile, as a Raspberry Pi's), so the clippy above never
      # compiles that path.
      - name: desktop host lints clean with gles
        run: cargo clippy --workspace --all-targets --features gles -- -D warnings

  # Miri checks the unsafe it can run: the raw-pointer helpers behind the
  # WebGL1 linkage (gl::raw, gl::table) and raam-model. The rest of our
  # unsafe is GL, NDK and libc calls, which Miri can't follow, and the
  # egui-driven app tests take too long under it for every push. Nightly
  # is pinned so a Miri update can't turn a push red on its own.
  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - run: cargo miri test -p raam-model
      - run: "cargo miri test -p raam-core --lib gl::"

  # Licences, RustSec advisories, duplicate versions and sources, by
  # deny.toml. The advisory database is fetched fresh, so a new advisory
  # can turn a run red on its own: update the lockfile, or ignore it in
  # deny.toml with the reason.
  deny:
    name: dependencies pass cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # CI can't run the goldens (pixels are exact per GPU), but it can hold
  # the rule's other half: a bless is a commit of its own.
  goldens:
    name: goldens blessed in their own commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: scripts/goldens-own-commit.sh "${{ github.event.pull_request.base.sha }}"

  # hosts/android is cfg(target_os = "android") throughout, so the native
  # clippy above sees an empty crate. This lints it for the frame's target
  # (32-bit ARM, API 23) with a pinned NDK.
  android:
    name: Android host lints clean
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      # The runner's SDK has sdkmanager; the NDK's clang builds the C in
      # the dependencies (ring, SQLite).
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;${NDK_VERSION}" > /dev/null
          TC="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TC/armv7a-linux-androideabi23-clang"
          echo "CC_armv7_linux_androideabi=$TC/armv7a-linux-androideabi23-clang" >> "$GITHUB_ENV"
          echo "AR_armv7_linux_androideabi=$TC/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo clippy -p raam-android --target armv7-linux-androideabi -- -D warnings
