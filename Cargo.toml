[package]
name = "raam"
description = "Turn a cheap Android photo frame into something you own: a fast, open slideshow for your own photos, with or without Immich"
readme = "README.md"
keywords = ["photo-frame", "immich", "slideshow", "egui", "android"]
categories = ["multimedia::images"]
# 0.0.0 on crates.io holds the name. The crates under crates/ aren't
# published, so neither is this until a release plan says otherwise.
publish = false
# Ship only code, README and licences (the docs live in the repo).
include = ["src/**", "build.rs", "README.md", "LICENSE-*"]
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The `raam` binary is the desktop/Linux host: the UX-iteration window on a
# dev machine, and a Linux frame's host too (`--fullscreen`, under X11 or
# Wayland). See docs/ARCHITECTURE.md "Hosts". A bare `raam`
# runs the slideshow on the engine; `--page` is the preset host, the widget
# gallery and every frame_ui screen by name, for the ux-qa pass.

[features]
# A GLES 2.0 context in place of desktop GL 3.2, linked to libGLESv2:
# for a Linux frame whose GPU has no core profile, as a Raspberry Pi's.
gles = ["raam-core/gles"]

[lints]
workspace = true

[dependencies]
raam-core.workspace = true
raam-model.workspace = true
raam-engine.workspace = true
log.workspace = true
# localtime_r, the Clock seam's local time.
libc = "0.2"
egui = { version = "=0.36.2", default-features = false }
egui-winit = { version = "=0.36.2", default-features = false }
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
# F12 / --screenshot.
png = "0.17"

[workspace]
members = ["crates/*", "hosts/*", "tools/palette"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noctonca/raam"
rust-version = "1.95"

[workspace.dependencies]
raam-model = { path = "crates/raam-model" }
raam-core = { path = "crates/raam-core" }
raam-engine = { path = "crates/raam-engine" }
log = "0.4"
# Every dependency added here must first earn its row in
# docs/ARCHITECTURE.md "The dependency register".

# Lints on top of clippy's defaults, for every member (each opts in with
# `[lints] workspace = true`), so they hold locally and not only in CI's
# `-D warnings`.
[workspace.lints.clippy]
# A public fn that can panic says when, under `# Panics`.
missing_panics_doc = "warn"
# Every unsafe block and impl says why it holds, under `// SAFETY:`.
undocumented_unsafe_blocks = "warn"

# Profiles live at the workspace root only (Cargo ignores them in
# members). Release: LTO earns its keep on the frame (binary size and the
# GL/decode hot paths).
[profile.release]
opt-level = 3
lto = true

# The web demo's wasm (hosts/web/build.sh): size over speed, one codegen
# unit so LTO sees everything, and no name section (1.4 MB of symbol
# names nobody downloads for); wasm-opt then shrinks it further.
[profile.web]
inherits = "release"
opt-level = "s"
codegen-units = 1
strip = true

# Release speed without LTO, for the goldens (scripts/goldens.sh) and any
# optimised desktop run: after an edit it relinks in ~7 s where release
# takes ~60 s, and every golden shot hashes the same (LTO doesn't change
# float results).
[profile.quick]
inherits = "release"
lto = false
