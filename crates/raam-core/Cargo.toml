[package]
name = "raam-core"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
raam-model.workspace = true
log.workspace = true
# No default features (the register's end state): the theme ships its own
# Roboto + Material Symbols subsets (-1.4 MB of default fonts).
egui = { version = "=0.36.2", default-features = false }
# The clock/weather overlay's glyph atlas rasterisation.
fontdue = "0.9"
# Vendored on-screen keyboard (upstream LICENSE included); `clipboard` off:
# it SIGABRTs on the real API-23 device (no Looper on the render thread).
egui_keyboard = { path = "../../vendor/egui_keyboard", default-features = false }
# Settings rows (store.rs): the Store seam's currency is (key, JSON value).
# Already in the tree via raam-engine, so no new APK surface.
serde_json = "1"

# The WebGL1 GL linkage (src/gl/webgl.rs). egui already brings web-sys on
# wasm32; these are the WebGL types the shim's tables hold.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "WebGlBuffer",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlRenderingContext",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
] }
