[package]
name = "raam-core"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
raam-model.workspace = true
log.workspace = true
# `default_fonts` stays on until the 026 theme (its own Roboto + Material
# Symbols subsets) crosses at migration step 6; the register's end state is
# no default features at all.
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
# The clock/weather overlay's glyph atlas rasterisation.
fontdue = "0.9"
# Vendored on-screen keyboard (upstream LICENSE included); `clipboard` off:
# it SIGABRTs on the real API-23 device (no Looper on the render thread).
egui_keyboard = { path = "../../vendor/egui_keyboard", default-features = false }
# Settings rows (store.rs): the Store seam's currency is (key, JSON value).
# Already in the tree via raam-engine, so no new APK surface.
serde_json = "1"
