[package]
name = "raam-android"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

# Android dependencies stay under the target gate (with
# #![cfg(target_os = "android")] in lib.rs) so `cargo check --workspace`
# is green on any dev machine.
[target.'cfg(target_os = "android")'.dependencies]
raam-model.workspace = true
raam-core.workspace = true
raam-engine.workspace = true
log.workspace = true
# No default features: drops the env_filter/regex stack nothing uses.
android_logger = { version = "0.14", default-features = false }
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = { version = "0.9", features = ["media"] }
# AMediaExtractor has no safe binding (extractor.rs).
ndk-sys = { version = "0.6", features = ["media"] }
# 0.21, knowingly: 0.22 redesigned the whole API (Env/EnvUnowned, typed
# GlobalRef, closure attach) and porting power/video_texture/player to it
# is a change of its own. Costs ~56 KB of duplicate jni next to
# android-activity's 0.22.
jni = "0.21"
# localtime_r, __system_property_get, setpriority.
libc = "0.2"
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }

[package.metadata.android]
package = "io.github.noctonca.raam"
build_targets = ["armv7-linux-androideabi"]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# The local photo folder on /sdcard (granted through su + pm grant; the
# root map in docs/ARCHITECTURE.md).
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"

# The wake lock that turns the screen on at wake time.
[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 34

[package.metadata.android.application]
label = "Raam"
debuggable = true

# Release signing: no keystore path in this public manifest. Point
# CARGO_APK_RELEASE_KEYSTORE / CARGO_APK_RELEASE_KEYSTORE_PASSWORD at
# yours (the dev debug keystore until the release key exists; see the
# release row in docs/ARCHITECTURE.md and scripts/env-check.sh).

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
# The frame's home app: singleTask, like any launcher, so HOME, the wake
# alarm and `am start` all reach one instance.
launch_mode = "singleTask"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "raam_android"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

# HOME: started at boot (which also re-arms the wake alarm a reboot
# erased; there's no BOOT_COMPLETED receiver) and after anything takes
# the foreground.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.HOME", "android.intent.category.DEFAULT"]
