[package]
name = "raam-web"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The web host is wasm32-only (lib.rs is `#![cfg]`-gated, as the Android
# host is), so natively it compiles to nothing and `cargo check
# --workspace` stays green on any dev machine. Build it with build.sh.
[target.'cfg(target_arch = "wasm32")'.dependencies]
raam-core.workspace = true
raam-model.workspace = true
log.workspace = true
egui = { version = "=0.36.2", default-features = false }
# The photo catalogue (www/faces.json, www/photos/credits.json); already in
# the tree through raam-core.
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "ContextAttributes2d",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "ImageData",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Performance",
    "PointerEvent",
    "UrlSearchParams",
    "VisibilityState",
    "WebGlContextAttributes",
    "WebGlRenderingContext",
    "Window",
    "console",
] }
