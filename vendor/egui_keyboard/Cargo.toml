[package]
name = "egui_keyboard"
version = "0.8.0"
repository = "https://github.com/podusowski/egui_keyboard"
description = "virtual keyboard widget for egui (vendored + patched locally for experiment 018: added '-' and '_' to the qwerty layout, needed for Immich server URLs/API keys - upstream's layout has no hyphen/underscore key at all)"
authors = ["Piotr Podusowski <podusowski@gmail.com>"]
license = "MIT"
categories = ["gui"]
edition = "2021"

[features]
default = ["clipboard"]
clipboard = ["dep:android_clipboard", "dep:arboard"]

[dependencies]
egui = "0.36.0"

[target.'cfg(target_os = "android")'.dependencies]
android_clipboard = { version = "0.1.0", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.4.1", default-features = false, optional = true }
